version: "2"

run:
  build-tags:
    - integration
    - e2e

linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # karga-server serves the CLI over the API in karga-sdk; it never imports the CLI.
        server:
          files:
            - "$all"
          deny:
            - pkg: github.com/hasankaradmir/karga-cli/
              desc: karga-server must not depend on the CLI

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hasankaradmir/karga-server
