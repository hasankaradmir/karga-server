version: "2"

run:
  build-tags:
    - integration
    - e2e

linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # karga-server serves the CLI over the API in karga-sdk; it never imports the CLI.
        server:
          files:
            - "$all"
          deny:
            - pkg: github.com/hasankaradmir/karga-cli/
              desc: karga-server must not depend on the CLI
        # The application talks to the runtime, the state and the proxies only through ports; the
        # composition root (internal/server, cmd) picks the adapters. Tests may use the fakes.
        application:
          files:
            - "**/internal/application/**"
            - "!$test"
          deny:
            - pkg: github.com/hasankaradmir/karga-server/internal/adapters
              desc: the application uses ports, not adapters
            - pkg: github.com/hasankaradmir/karga-server/internal/infrastructure
              desc: the application uses ports, not infrastructure
            - pkg: github.com/moby
              desc: the application uses ports.Runtime, not Docker
        # The wire (karga-sdk/api) is internal/server's business: the application, the ports and the
        # domain have their own types, and internal/server/backend.go maps them.
        wire:
          files:
            - "**/internal/application/**"
            - "**/internal/ports/**"
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/hasankaradmir/karga-sdk/api
              desc: only internal/server knows the API

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hasankaradmir/karga-server
