# content is served at / (changing it recreates the workload through its Config).
content: v1
# healthy=false makes the healthcheck fail.
healthy: true
# listener=<name> exposes the web port on that tcp gateway listener (the test adds it).
listener: ""
# route=<host> exposes the web port for that host on gateway listener routeListener.
route: ""
routeListener: http
# startDelay seconds before the server listens, like a real application starting up.
startDelay: 0
# strategy is the update strategy.
strategy: replace
# listenPort is the port the server listens on (the containerPort); servicePort is the port of
# Service web (default listenPort).
listenPort: 8080
servicePort: 0
# second=true adds workload and Service api, serving the same content on listenPort+1.
second: false
# apiDependsOn=true makes api start only once Service web is ready.
apiDependsOn: false
# echo=true adds a tcp echo server on containerPort 9000 (Service web port 9000) that counts its
# connections in /tmp/conns; echoListener=<name>
# exposes it on that tcp gateway listener.
echo: false
echoListener: ""
# raw=true adds a raw HTTP server on containerPort 9001 (Service web port 9001), routed at /x/ on
# the route host: /x/slow answers after 20 seconds, /x/ws switches protocols and echoes.
raw: false
# rawPath, rawPathType and rawTo are the raw server's exposure; /path... answers "<path it got>
# <x-forwarded-prefix>".
rawPath: /x
rawPathType: prefix
rawTo: ""
# envSecret, if set, is stored in Secret app-env and given to web as variable SECRET_VALUE.
envSecret: ""
# drain is the replace drain timeout.
drain: 2s
# tls.cert/tls.key (PEM) serve the route on an https listener; plain HTTP on port 80 redirects to it.
tls:
  cert: ""
  key: ""
# health is the web workload's health check type: exec (wget in the image), tcp or http (karga checks).
# With http, healthy=false checks a missing path.
health: exec
# crash=true makes workload web exit with code 3 as soon as it starts (Docker restarts it).
crash: false
