{{- if .Values.tls.cert }}
apiVersion: karga.io/v1alpha1
kind: Secret
metadata:
  name: site-tls
spec:
  values:
    tls.crt: {{ .Values.tls.cert | quote }}
    tls.key: {{ .Values.tls.key | quote }}
---
{{- end }}
{{- if .Values.envSecret }}
apiVersion: karga.io/v1alpha1
kind: Secret
metadata:
  name: app-env
spec:
  values:
    value: {{ .Values.envSecret | quote }}
---
{{- end }}
apiVersion: karga.io/v1alpha1
kind: Network
metadata:
  name: web-net
---
apiVersion: karga.io/v1alpha1
kind: Config
metadata:
  name: site
spec:
  files:
    index.html: {{ .Values.content | quote }}
    {{- if .Values.echo }}
    # Counts the connections the echo server got, in /tmp/conns.
    echo.sh: |
      #!/bin/sh
      echo >> /tmp/conns
      exec cat
    {{- end }}
    {{- if .Values.raw }}
    raw.sh: |
      #!/bin/sh
      read -r method path rest
      prefix=""
      while read -r line; do
        line=$(printf %s "$line" | tr -d '\r')
        [ "$line" = "" ] && break
        case "$line" in [Xx]-[Ff]orwarded-[Pp]refix:*) prefix=${line#*: } ;; esac
      done
      case "$path" in
      */slow) sleep 20; printf 'HTTP/1.1 200 OK\r\nContent-Length: 4\r\nConnection: close\r\n\r\nslow' ;;
      */path*) body="$path $prefix"; printf 'HTTP/1.1 200 OK\r\nContent-Length: %d\r\nConnection: close\r\n\r\n%s' ${#body} "$body" ;;
      *) printf 'HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n\r\n'; exec cat ;;
      esac
    {{- end }}
---
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: web
spec:
  image: busybox:1.37
  command: [sh, -c, "sleep {{ .Values.startDelay }}; {{ if .Values.echo }}nc -ll -p 9000 -e sh /www/echo.sh & {{ end }}{{ if .Values.raw }}nc -ll -p 9001 -e sh /www/raw.sh & {{ end }}exec httpd -f -p {{ .Values.listenPort }} -h /www"]
  networks: [web-net]
  {{- if .Values.envSecret }}
  environmentFrom:
    - {name: SECRET_VALUE, secret: app-env, key: value}
  {{- end }}
  mounts:
    - config: site
      mountPath: /www
  ports:
    - name: http
      containerPort: {{ .Values.listenPort }}
    {{- if .Values.echo }}
    - name: echo
      containerPort: 9000
    {{- end }}
    {{- if .Values.raw }}
    - name: raw
      containerPort: 9001
    {{- end }}
  healthCheck:
    type: {{ .Values.health }}
    {{- if eq .Values.health "exec" }}
    {{- if .Values.healthy }}
    command: [wget, -q, -O, /dev/null, "http://127.0.0.1:{{ .Values.listenPort }}/"]
    {{- else }}
    command: ["false"]
    {{- end }}
    {{- else }}
    port: {{ .Values.listenPort }}
    {{- if eq .Values.health "http" }}
    path: {{ if .Values.healthy }}/{{ else }}/missing{{ end }}
    {{- end }}
    {{- end }}
    interval: 1s
    timeout: 1s
    retries: 2
    startPeriod: 10s
  updateStrategy:
    type: {{ .Values.strategy }}
    drainTimeout: {{ .Values.drain }}
{{- if .Values.second }}
---
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: api
spec:
  image: busybox:1.37
  command: [sh, -c, "sleep {{ .Values.startDelay }}; exec httpd -f -p {{ add .Values.listenPort 1 }} -h /www"]
  {{- if .Values.apiDependsOn }}
  dependsOn: [web]
  {{- end }}
  networks: [web-net]
  mounts:
    - config: site
      mountPath: /www
  ports:
    - name: http
      containerPort: {{ add .Values.listenPort 1 }}
  healthCheck:
    type: exec
    command: [wget, -q, -O, /dev/null, "http://127.0.0.1:{{ add .Values.listenPort 1 }}/"]
    interval: 1s
    timeout: 1s
    retries: 2
    startPeriod: 10s
  updateStrategy:
    type: {{ .Values.strategy }}
    drainTimeout: {{ .Values.drain }}
{{- end }}
---
apiVersion: karga.io/v1alpha1
kind: Service
metadata:
  name: web
spec:
  workload: web
  ports:
    - name: http
      port: {{ .Values.servicePort | default .Values.listenPort }}
    {{- if .Values.echo }}
    - name: echo
      port: 9000
    {{- end }}
    {{- if .Values.raw }}
    - name: raw
      port: 9001
    {{- end }}
  {{- if or .Values.listener .Values.route .Values.echoListener }}
  expose:
    {{- if .Values.listener }}
    - port: http
      listener: {{ .Values.listener }}
    {{- end }}
    {{- if .Values.route }}
    - port: http
      listener: {{ .Values.routeListener }}
      host: {{ .Values.route }}
      {{- if .Values.tls.cert }}
      tls: {secret: site-tls}
      {{- end }}
    {{- if .Values.raw }}
    - port: raw
      listener: {{ .Values.routeListener }}
      host: {{ .Values.route }}
      path: {{ .Values.rawPath }}
      pathType: {{ .Values.rawPathType }}
      {{- if .Values.rawTo }}
      to: {{ .Values.rawTo }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.echoListener }}
    - port: echo
      listener: {{ .Values.echoListener }}
    {{- end }}
  {{- end }}
{{- if .Values.second }}
---
apiVersion: karga.io/v1alpha1
kind: Service
metadata:
  name: api
spec:
  workload: api
  ports:
    - name: http
      port: {{ add .Values.listenPort 1 }}
{{- end }}
