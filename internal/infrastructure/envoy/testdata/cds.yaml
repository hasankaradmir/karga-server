resources:
  - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
    connect_timeout: 1s
    health_checks:
      - healthy_threshold: 1
        interval: 0.500s
        no_traffic_interval: 0.500s
        tcp_health_check: {}
        timeout: 1s
        unhealthy_interval: 0.500s
        unhealthy_threshold: 3
    load_assignment:
      cluster_name: db_pg_p5432
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 41001
    name: db_pg_p5432
    transport_socket:
      name: envoy.transport_sockets.upstream_proxy_protocol
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.proxy_protocol.v3.ProxyProtocolUpstreamTransport
        allow_unspecified_address: true
        config:
          version: V2
        transport_socket:
          name: envoy.transport_sockets.raw_buffer
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer
    type: STATIC
  - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
    cluster_type:
      name: envoy.cluster.dns
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
        dns_lookup_family: V4_ONLY
        dns_refresh_rate: 1s
    connect_timeout: 1s
    health_checks:
      - healthy_threshold: 1
        http_health_check:
          expected_statuses:
            - end: "400"
              start: "200"
          path: /healthz
        interval: 0.500s
        no_traffic_interval: 0.500s
        timeout: 1s
        unhealthy_interval: 0.500s
        unhealthy_threshold: 3
    load_assignment:
      cluster_name: web-p8080
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: karga-web-r2
                    port_value: 8080
    name: web-p8080
