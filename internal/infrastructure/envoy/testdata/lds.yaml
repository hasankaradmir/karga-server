resources:
  - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    address:
      socket_address:
        address: 127.0.0.1
        port_value: 5432
    enable_reuse_port: true
    filter_chains:
      - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              cluster: db_pg_p5432
              idle_timeout: 3600s
              max_connect_attempts: 3
              stat_prefix: tcp_127.0.0.1_5432
    name: tcp_127.0.0.1_5432
  - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 443
    enable_reuse_port: true
    filter_chains:
      - filter_chain_match:
          server_names:
            - secure.example
        filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              common_http_protocol_options:
                idle_timeout: 3600s
              http_filters:
                - name: envoy.filters.http.buffer
                  typed_config:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                    max_request_bytes: 1048576
                - name: envoy.filters.http.local_ratelimit
                  typed_config:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    filter_enabled:
                      default_value:
                        numerator: 100
                    filter_enforced:
                      default_value:
                        numerator: 100
                    stat_prefix: http_0.0.0.0_443
                    token_bucket:
                      fill_interval: 1s
                      max_tokens: 100
                      tokens_per_fill: 100
                - name: envoy.filters.http.router
                  typed_config:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              merge_slashes: true
              normalize_path: true
              request_headers_timeout: 10s
              route_config:
                name: http_0.0.0.0_443
                request_headers_to_add:
                  - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    header:
                      key: x-forwarded-for
                      value: '%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%'
                virtual_hosts:
                  - domains:
                      - secure.example
                      - secure.example:*
                    name: secure.example
                    routes:
                      - match:
                          prefix: /
                        route:
                          cluster: app_web_p3000
                          retry_policy:
                            num_retries: 2
                            retry_on: connect-failure
                          timeout: 30s
              stat_prefix: http_0.0.0.0_443
              stream_idle_timeout: 600s
              upgrade_configs:
                - upgrade_type: websocket
              use_remote_address: true
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_certificates:
                - certificate_chain:
                    filename: /etc/karga-proxy/certs/app_443_secure.example.crt
                  private_key:
                    filename: /etc/karga-proxy/certs/app_443_secure.example.key
              tls_params:
                tls_minimum_protocol_version: TLSv1_2
    listener_filters:
      - name: envoy.filters.listener.tls_inspector
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    name: http_0.0.0.0_443
    per_connection_buffer_limit_bytes: 32768
  - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 80
    enable_reuse_port: true
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              common_http_protocol_options:
                idle_timeout: 3600s
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              merge_slashes: true
              normalize_path: true
              request_headers_timeout: 10s
              route_config:
                name: http_0.0.0.0_80
                request_headers_to_add:
                  - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    header:
                      key: x-forwarded-for
                      value: '%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%'
                virtual_hosts:
                  - domains:
                      - app.local
                      - app.local:*
                    name: app.local
                    routes:
                      - match:
                          path: /healthz
                        route:
                          cluster: app_web_p3000
                          retry_policy:
                            num_retries: 2
                            retry_on: connect-failure
                          timeout: 0s
                      - match:
                          path_separated_prefix: /api
                        request_headers_to_add:
                          - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            header:
                              key: x-forwarded-prefix
                              value: /api
                        route:
                          cluster: app_api_p8080
                          regex_rewrite:
                            pattern:
                              regex: ^/api/?(.*)
                            substitution: /\1
                          retry_policy:
                            num_retries: 2
                            retry_on: connect-failure
                          timeout: 0s
                      - match:
                          prefix: /
                        route:
                          cluster: app_web_p3000
                          retry_policy:
                            num_retries: 2
                            retry_on: connect-failure
                          timeout: 0s
                  - domains:
                      - b.local
                      - b.local:*
                    name: b.local
                    routes:
                      - match:
                          prefix: /
                        route:
                          cluster: b_web_p3000
                          retry_policy:
                            num_retries: 2
                            retry_on: connect-failure
                          timeout: 0s
                  - domains:
                      - secure.example
                      - secure.example:*
                    name: secure.example-https
                    routes:
                      - match:
                          prefix: /
                        redirect:
                          https_redirect: true
              stat_prefix: http_0.0.0.0_80
              stream_idle_timeout: 300s
              upgrade_configs:
                - upgrade_type: websocket
              use_remote_address: true
    name: http_0.0.0.0_80
    per_connection_buffer_limit_bytes: 32768
