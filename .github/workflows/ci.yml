name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu-latest ships a running Docker Engine; the gateway and proxy tests run here.
      - name: Pull images the tests use
        run: |
          docker pull -q busybox:1.37
          docker pull -q "$(grep -o 'envoyproxy/envoy:[^"]*' internal/infrastructure/envoy/envoy.go)"
      - run: make test-integration
      - name: Docker state on failure
        if: failure()
        run: |
          docker ps -a
          docker logs karga-gateway 2>&1 | tail -50 || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The e2e tests drive the karga CLI, built from its repository.
      - uses: actions/checkout@v4
        with:
          repository: hasankaradmir/karga
          path: karga-cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-e2e
        env:
          KARGA_CLI_SRC: ${{ github.workspace }}/karga-cli
